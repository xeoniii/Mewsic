  # ─── Linux (DEB + RPM) ─────────────────────────────────────────────────────
  release-linux:
    permissions:
      contents: write
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf lld clang libfuse2

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm install

      - name: Ensure release draft exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "${{ github.ref_name }}" --draft --title "Mewsic v$VERSION" --notes "See the assets below to download the latest version of Mewsic." --repo "${{ github.repository }}" || true

      # 1. Build Slim version (NO yt-dlp, NO ffmpeg)
      - name: Build Slim app (Linux DEB, RPM, AppImage)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles deb,rpm,appimage

      - name: Prepare Linux Slim artifacts
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release-artifacts
          DEB=$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -n1)
          RPM=$(find src-tauri/target/release/bundle/rpm -name '*.rpm' | head -n1)
          APPIMAGE_TAR=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage.tar.gz' 2>/dev/null | head -n1)
          APPIMAGE_SIG=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage.tar.gz.sig' 2>/dev/null | head -n1)

          if [ -n "$DEB" ] && [ -f "$DEB" ]; then
            cp "$DEB" release-artifacts/Mewsic-Setup-Slim.deb
          fi
          if [ -n "$RPM" ] && [ -f "$RPM" ]; then
            cp "$RPM" release-artifacts/Mewsic-Setup-Slim.rpm
          fi
          if [ -n "$APPIMAGE_TAR" ] && [ -f "$APPIMAGE_TAR" ]; then
            cp "$APPIMAGE_TAR" release-artifacts/Mewsic-Setup-Slim.AppImage.tar.gz
          fi
          if [ -n "$APPIMAGE_SIG" ] && [ -f "$APPIMAGE_SIG" ]; then
            cp "$APPIMAGE_SIG" release-artifacts/Mewsic-Setup-Slim.AppImage.tar.gz.sig
            mkdir -p updater-meta
            node -e '
              const fs = require("fs");
              const sig = fs.readFileSync(process.argv[1], "utf8").trim();
              const meta = {
                platform: "linux-x86_64",
                url: `https://github.com/${process.env.REPO}/releases/download/${process.env.TAG}/Mewsic-Setup-Slim.AppImage.tar.gz`,
                signature: sig
              };
              fs.writeFileSync("updater-meta/linux-x86_64.json", JSON.stringify(meta, null, 2));
            ' "$APPIMAGE_SIG"
          fi

      # 2. Download binaries and build Full version
      - name: Download bundled yt-dlp and ffmpeg binaries
        run: |
          mkdir -p src-tauri/bin
          curl -L -o src-tauri/bin/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp
          curl -L -o src-tauri/bin/ffmpeg https://github.com/eugeneware/ffmpeg-static/releases/latest/download/ffmpeg-linux-x64
          chmod +x src-tauri/bin/*

      - name: Build Full app (Linux DEB, RPM with bundled binaries)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles deb,rpm

      - name: Prepare Linux Full artifacts
        run: |
          DEB=$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -n1)
          RPM=$(find src-tauri/target/release/bundle/rpm -name '*.rpm' | head -n1)
          if [ -n "$DEB" ] && [ -f "$DEB" ]; then
            cp "$DEB" release-artifacts/Mewsic-Setup.deb
          fi
          if [ -n "$RPM" ] && [ -f "$RPM" ]; then
            cp "$RPM" release-artifacts/Mewsic-Setup.rpm
          fi

      # 3. Upload only static artifacts and delete versioned assets
      - name: Upload static Linux artifacts to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in release-artifacts/*; do
            if [ -f "$f" ]; then
              echo "Uploading $f..."
              gh release upload "${{ github.ref_name }}" "$f" --repo "${{ github.repository }}" --clobber
            fi
          done

      - name: Clean up versioned assets from release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | \
            grep -E '(_[0-9]+\.[0-9]+|-[0-9]+\.[0-9]+)' | \
            while read -r asset; do
              echo "Deleting versioned asset: $asset"
              gh release delete-asset "${{ github.ref_name }}" "$asset" --repo "${{ github.repository }}" -y || true
            done

      - name: Upload updater metadata artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: updater-linux-x86_64
          path: updater-meta/*.json
          if-no-files-found: ignore

  # ─── Finalize Updater Manifest (latest.json) ───────────────────────────────
  publish-updater:
    needs: [release-windows, release-macos-arm, release-macos-x64, release-linux]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download updater metadata
        uses: actions/download-artifact@v4
        with:
          path: updater-meta
          pattern: updater-*
          merge-multiple: true
        continue-on-error: true

      - name: Construct and upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          node -e '
            const fs = require("fs");
            const path = require("path");

            const metaDir = "updater-meta";
            const platforms = {};

            if (fs.existsSync(metaDir)) {
              const files = fs.readdirSync(metaDir);
              for (const file of files) {
                if (file.endsWith(".json")) {
                  try {
                    const data = JSON.parse(fs.readFileSync(path.join(metaDir, file), "utf8"));
                    if (data.platform && data.url && data.signature) {
                      platforms[data.platform] = {
                        url: data.url,
                        signature: data.signature.trim()
                      };
                    }
                  } catch (e) {
                    console.error("Error parsing", file, e);
                  }
                }
              }
            }

            const manifest = {
              version: process.env.VERSION,
              notes: "See the assets below to download the latest version of Mewsic.",
              pub_date: process.env.PUB_DATE,
              platforms
            };

            fs.writeFileSync("latest.json", JSON.stringify(manifest, null, 2));
            console.log("Generated latest.json:\n", JSON.stringify(manifest, null, 2));
          '

          gh release upload "${{ github.ref_name }}" "latest.json" --repo "${{ github.repository }}" --clobber

      - name: Final sweep to delete any versioned assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | \
            grep -E '(_[0-9]+\.[0-9]+|-[0-9]+\.[0-9]+)' | \
            while read -r asset; do
              echo "Deleting versioned asset: $asset"
              gh release delete-asset "${{ github.ref_name }}" "$asset" --repo "${{ github.repository }}" -y || true
            done
