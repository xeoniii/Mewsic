          chmod +x src-tauri/bin/*

      - name: Build Full app (macOS x86_64 with bundled binaries)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: npm run tauri build -- --target x86_64-apple-darwin --bundles dmg,app

      - name: Prepare macOS x86_64 Full artifact
        run: |
          DMG=$(find src-tauri/target/x86_64-apple-darwin/release/bundle/dmg -name '*.dmg' | head -n1)
          if [ -n "$DMG" ] && [ -f "$DMG" ]; then
            cp "$DMG" release-artifacts/Mewsic-x64.dmg
          fi

      # 3. Upload only static artifacts and delete versioned assets
      - name: Upload static macOS x86_64 artifacts to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in release-artifacts/*; do
