          APP_TAR=$(find src-tauri/target/x86_64-apple-darwin/release/bundle/macos -name '*.app.tar.gz' | head -n1)
          APP_SIG=$(find src-tauri/target/x86_64-apple-darwin/release/bundle/macos -name '*.app.tar.gz.sig' | head -n1)

