name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ─── Windows ───────────────────────────────────────────────────────────────
  release-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm install

      - name: Ensure release draft exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "${{ github.ref_name }}" --draft --title "Mewsic v$VERSION" --notes "See the assets below to download the latest version of Mewsic." --repo "${{ github.repository }}" || true

      # 1. Build Slim version (NO yt-dlp, NO ffmpeg)
      - name: Build Slim app (Windows NSIS & MSI without bundled binaries)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis,msi

      - name: Prepare Windows Slim artifacts
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          mkdir -p release-artifacts
          SETUP_EXE=$(find src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -name '*setup.exe' | head -n1)
          SETUP_MSI=$(find src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi -name '*.msi' | head -n1)
          SETUP_SIG=$(find src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -name '*setup.exe.sig' | head -n1)
          SETUP_ZIP=$(find src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -name '*.nsis.zip' | head -n1)
          ZIP_SIG=$(find src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -name '*.nsis.zip.sig' | head -n1)

          if [ -n "$SETUP_EXE" ] && [ -f "$SETUP_EXE" ]; then
            cp "$SETUP_EXE" release-artifacts/Mewsic-Setup-Slim.exe
          fi
          if [ -n "$SETUP_MSI" ] && [ -f "$SETUP_MSI" ]; then
            cp "$SETUP_MSI" release-artifacts/Mewsic-Setup-Slim.msi
          fi
          if [ -n "$SETUP_SIG" ] && [ -f "$SETUP_SIG" ]; then
            cp "$SETUP_SIG" release-artifacts/Mewsic-Setup-Slim.exe.sig
          fi
          if [ -n "$SETUP_ZIP" ] && [ -f "$SETUP_ZIP" ]; then
            cp "$SETUP_ZIP" release-artifacts/Mewsic-Setup-Slim.nsis.zip
            if [ -n "$ZIP_SIG" ] && [ -f "$ZIP_SIG" ]; then
              cp "$ZIP_SIG" release-artifacts/Mewsic-Setup-Slim.nsis.zip.sig
            fi
          fi

          mkdir -p updater-meta
          SIG_FILE=""
          UPDATER_FILE=""
          if [ -f "release-artifacts/Mewsic-Setup-Slim.nsis.zip.sig" ]; then
            SIG_FILE="release-artifacts/Mewsic-Setup-Slim.nsis.zip.sig"
            UPDATER_FILE="Mewsic-Setup-Slim.nsis.zip"
          elif [ -f "release-artifacts/Mewsic-Setup-Slim.exe.sig" ]; then
            SIG_FILE="release-artifacts/Mewsic-Setup-Slim.exe.sig"
            UPDATER_FILE="Mewsic-Setup-Slim.exe"
          fi

          if [ -n "$SIG_FILE" ]; then
            node -e '
              const fs = require("fs");
              const sig = fs.readFileSync(process.argv[1], "utf8").trim();
              const meta = {
                platform: "windows-x86_64",
                url: `https://github.com/${process.env.REPO}/releases/download/${process.env.TAG}/${process.argv[2]}`,
                signature: sig
              };
              fs.writeFileSync("updater-meta/windows-x86_64.json", JSON.stringify(meta, null, 2));
            ' "$SIG_FILE" "$UPDATER_FILE"
          fi

      # 2. Download binaries and build Full version
      - name: Download bundled yt-dlp and ffmpeg binaries
        shell: bash
        run: |
          mkdir -p src-tauri/bin
          curl -L -o src-tauri/bin/yt-dlp.exe https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe
          curl -L -o src-tauri/bin/ffmpeg.exe https://github.com/eugeneware/ffmpeg-static/releases/latest/download/ffmpeg-win32-x64

      - name: Build Full app (Windows NSIS & MSI with bundled binaries)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis,msi

      - name: Prepare Windows Full artifact
        shell: bash
        run: |
          SETUP_EXE=$(find src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -name '*setup.exe' | head -n1)
          SETUP_MSI=$(find src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi -name '*.msi' | head -n1)
          if [ -n "$SETUP_EXE" ] && [ -f "$SETUP_EXE" ]; then
            cp "$SETUP_EXE" release-artifacts/Mewsic-Setup.exe
          fi
          if [ -n "$SETUP_MSI" ] && [ -f "$SETUP_MSI" ]; then
            cp "$SETUP_MSI" release-artifacts/Mewsic-Setup.msi
          fi

      # 3. Upload only static artifacts and delete versioned assets
      - name: Upload static Windows artifacts to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          for f in release-artifacts/*; do
            if [ -f "$f" ]; then
              echo "Uploading $f..."
              gh release upload "${{ github.ref_name }}" "$f" --repo "${{ github.repository }}" --clobber
            fi
          done

      - name: Clean up versioned assets from release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | \
            grep -E '(_[0-9]+\.[0-9]+|-[0-9]+\.[0-9]+)' | \
            while read -r asset; do
              echo "Deleting versioned asset: $asset"
              gh release delete-asset "${{ github.ref_name }}" "$asset" --repo "${{ github.repository }}" -y || true
            done

      - name: Upload updater metadata artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: updater-windows-x86_64
          path: updater-meta/*.json
          if-no-files-found: ignore

  # ─── macOS (ARM64) ─────────────────────────────────────────────────────────
  release-macos-arm:
    permissions:
      contents: write
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm install

      - name: Ensure release draft exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "${{ github.ref_name }}" --draft --title "Mewsic v$VERSION" --notes "See the assets below to download the latest version of Mewsic." --repo "${{ github.repository }}" || true

      # 1. Build Slim version (NO yt-dlp, NO ffmpeg)
      - name: Build Slim app (macOS ARM64 without bundled binaries)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: npm run tauri build -- --target aarch64-apple-darwin --bundles dmg,app

      - name: Prepare macOS ARM64 Slim artifacts
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release-artifacts
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' | head -n1)
          APP_TAR=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name '*.app.tar.gz' | head -n1)
          APP_SIG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name '*.app.tar.gz.sig' | head -n1)

          if [ -n "$DMG" ] && [ -f "$DMG" ]; then
            cp "$DMG" release-artifacts/Mewsic-arm64-Slim.dmg
          fi
          if [ -n "$APP_TAR" ] && [ -f "$APP_TAR" ]; then
            cp "$APP_TAR" release-artifacts/Mewsic-arm64-Slim.app.tar.gz
          fi
          if [ -n "$APP_SIG" ] && [ -f "$APP_SIG" ]; then
            cp "$APP_SIG" release-artifacts/Mewsic-arm64-Slim.app.tar.gz.sig
            mkdir -p updater-meta
            node -e '
              const fs = require("fs");
              const sig = fs.readFileSync(process.argv[1], "utf8").trim();
              const meta = {
                platform: "darwin-aarch64",
                url: `https://github.com/${process.env.REPO}/releases/download/${process.env.TAG}/Mewsic-arm64-Slim.app.tar.gz`,
                signature: sig
              };
              fs.writeFileSync("updater-meta/darwin-aarch64.json", JSON.stringify(meta, null, 2));
            ' "$APP_SIG"
          fi

      # 2. Download binaries and build Full version
      - name: Download bundled yt-dlp and ffmpeg binaries
        run: |
          mkdir -p src-tauri/bin
          curl -L -o src-tauri/bin/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos
          curl -L -o src-tauri/bin/ffmpeg https://github.com/eugeneware/ffmpeg-static/releases/latest/download/ffmpeg-darwin-arm64
          chmod +x src-tauri/bin/*

      - name: Build Full app (macOS ARM64 with bundled binaries)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: npm run tauri build -- --target aarch64-apple-darwin --bundles dmg,app

      - name: Prepare macOS ARM64 Full artifact
        run: |
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' | head -n1)
          if [ -n "$DMG" ] && [ -f "$DMG" ]; then
            cp "$DMG" release-artifacts/Mewsic-arm64.dmg
          fi

      # 3. Upload only static artifacts and delete versioned assets
      - name: Upload static macOS ARM64 artifacts to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in release-artifacts/*; do
            if [ -f "$f" ]; then
              echo "Uploading $f..."
              gh release upload "${{ github.ref_name }}" "$f" --repo "${{ github.repository }}" --clobber
            fi
          done

      - name: Clean up versioned assets from release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | \
            grep -E '(_[0-9]+\.[0-9]+|-[0-9]+\.[0-9]+)' | \
            while read -r asset; do
              echo "Deleting versioned asset: $asset"
              gh release delete-asset "${{ github.ref_name }}" "$asset" --repo "${{ github.repository }}" -y || true
            done

      - name: Upload updater metadata artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: updater-darwin-aarch64
          path: updater-meta/*.json
          if-no-files-found: ignore

  # ─── macOS (x86_64) ────────────────────────────────────────────────────────
  release-macos-x64:
    permissions:
      contents: write
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm install

      - name: Ensure release draft exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "${{ github.ref_name }}" --draft --title "Mewsic v$VERSION" --notes "See the assets below to download the latest version of Mewsic." --repo "${{ github.repository }}" || true

