                signature: sig
              };
              fs.writeFileSync("updater-meta/darwin-x86_64.json", JSON.stringify(meta, null, 2));
            ' "$APP_SIG"
          fi

      # 2. Download binaries and build Full version
      - name: Download bundled yt-dlp and ffmpeg binaries
