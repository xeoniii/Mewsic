[package]
name = "mewsic"
version = "1.0.0-3"
description = "Mewsic — A modern offline music player"
authors = ["xeoniii <https://github.com/xeoniii>"]
license = "GPL-3.0-only"
repository = "https://github.com/xeoniii/Mewsic"
edition = "2021"
rust-version = "1.70"



[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.4"
lofty = "0.18"
base64 = "0.21"
rustc-hash = "1.1"
tauri-plugin-localhost = "2"
url = "2.5.8"
percent-encoding = "2.3.2"
tiny_http = "0.12.0"
image = "0.24"
rayon = "1.8"
discord-rich-presence = "0.2.4"
tauri-plugin-single-instance = "2"
reqwest = { version = "0.11", features = ["json", "cookies", "stream"] }
futures-util = "0.3"
urlencoding = "2.1"
regex = "1.10"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
raw-window-handle = "0.6"
sysinfo = "0.30"
mimalloc = { version = "0.1", default-features = false }
tungstenite = "0.28.0"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
souvlaki = { version = "0.8", default-features = false }


[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort" # Enforce smaller binary and slightly faster performance
codegen-units = 1 # Better optimizations at the cost of compile time
lto = true # Link Time Optimization for maximum performance
opt-level = 3 # Maximize speed
strip = true # Remove debug symbols for smaller binary size
